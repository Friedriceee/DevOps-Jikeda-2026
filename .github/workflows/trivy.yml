name: Trivy security scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  filesystem:
    name: Scan repository filesystem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: '1'

  image:
    name: Scan release image when configured
    if: ${{ vars.TRIVY_IMAGE != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ vars.TRIVY_IMAGE }}
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: '1'
